<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — AI Gateway</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0a0a0f;--surface:#111118;--border:#1e1e2e;--text:#e2e2f0;--muted:#6b6b8a;--accent:#7c6af7;--green:#22d3a5;--red:#f43f5e}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .grid-bg{position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:0.3;pointer-events:none}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px;width:100%;max-width:440px;position:relative;z-index:10}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center}
  .logo-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:white}
  .logo-text{font-size:18px;font-weight:700}
  h1{font-size:24px;font-weight:700;text-align:center;margin-bottom:8px}
  .subtitle{font-size:14px;color:var(--muted);text-align:center;margin-bottom:32px}
  .google-btn{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:all .2s;font-family:'Inter',sans-serif;text-decoration:none}
  .google-btn:hover{border-color:var(--accent);background:rgba(124,106,247,0.05)}
  .divider{display:flex;align-items:center;gap:16px;margin:24px 0;color:var(--muted);font-size:12px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .form-group{margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-family:'JetBrains Mono',monospace}
  input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;font-family:'Inter',sans-serif}
  input:focus{border-color:var(--accent)}
  .btn{width:100%;padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
  .btn-primary{background:var(--accent);color:white;margin-top:8px}
  .btn-primary:hover{opacity:.85}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .error{color:var(--red);font-size:13px;margin-top:12px;text-align:center;display:none}
  .switch{text-align:center;margin-top:24px;font-size:14px;color:var(--muted)}
  .switch a{color:var(--accent);text-decoration:none}
  .tabs{display:flex;border:1px solid var(--border);border-radius:8px;margin-bottom:24px;overflow:hidden}
  .tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;border:none;background:transparent;color:var(--muted);font-family:'Inter',sans-serif}
  .tab.active{background:var(--accent);color:white}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon">AI</div>
    <div class="logo-text">Enterprise AI Gateway</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign in</button>
    <button class="tab" id="tab-signup" onclick="switchTab('signup')">Sign up</button>
  </div>

  <a href="/auth/google" class="google-btn">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
    Continue with Google
  </a>

  <div class="divider">or</div>

  <div id="form-login">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()" />
    </div>
    <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Sign in</button>
    <div class="error" id="login-error"></div>
  </div>

  <div id="form-signup" style="display:none">
    <div class="form-group">
      <label>Full name</label>
      <input type="text" id="signup-name" placeholder="Your name" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="signup-email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="signup-password" placeholder="Min 8 characters" onkeydown="if(event.key==='Enter')doSignup()" />
    </div>
    <button class="btn btn-primary" id="signup-btn" onclick="doSignup()">Create account</button>
    <div class="error" id="signup-error"></div>
  </div>
</div>

<script>
const path = window.location.pathname;
if (path === '/signup') switchTab('signup');

function switchTab(tab) {
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  if (!email || !password) { showError(err, 'Please fill in all fields'); return; }
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (!res.ok) { showError(err, data.detail || 'Login failed'); return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = '/app';
  } catch(e) { showError(err, 'Connection error'); }
  finally { btn.disabled = false; btn.textContent = 'Sign in'; }
}

async function doSignup() {
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const btn = document.getElementById('signup-btn');
  const err = document.getElementById('signup-error');
  if (!email || !password) { showError(err, 'Please fill in all fields'); return; }
  if (password.length < 8) { showError(err, 'Password must be at least 8 characters'); return; }
  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    const res = await fetch('/auth/signup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password, full_name: name})
    });
    const data = await res.json();
    if (!res.ok) { showError(err, data.detail || 'Signup failed'); return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = '/app';
  } catch(e) { showError(err, 'Connection error'); }
  finally { btn.disabled = false; btn.textContent = 'Create account'; }
}

function showError(el, msg) { el.textContent = msg; el.style.display = 'block'; }

// Forgot password flow
const urlParams = new URLSearchParams(window.location.search);
const resetToken = urlParams.get('reset_token');
if (window.location.pathname === '/reset-password' || resetToken) {
  document.querySelector('.tabs').style.display = 'none';
  document.getElementById('form-login').style.display = 'none';
  document.getElementById('form-signup').style.display = 'none';
  document.querySelector('.google-btn').style.display = 'none';
  document.querySelector('.divider').style.display = 'none';
  document.querySelector('h1') && (document.querySelector('h1').textContent = 'Reset password');
  const resetForm = document.createElement('div');
  resetForm.innerHTML = `
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="new-password" placeholder="Min 8 characters" />
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm-password" placeholder="Repeat password" />
    </div>
    <button class="btn btn-primary" onclick="doReset()">Reset Password</button>
    <div class="error" id="reset-error"></div>
  `;
  document.querySelector('.card').appendChild(resetForm);
}

async function doReset() {
  const token = new URLSearchParams(window.location.search).get('token');
  const newPw = document.getElementById('new-password').value;
  const confirmPw = document.getElementById('confirm-password').value;
  const err = document.getElementById('reset-error');
  if (newPw !== confirmPw) { showError(err, 'Passwords do not match'); return; }
  if (newPw.length < 8) { showError(err, 'Password must be at least 8 characters'); return; }
  try {
    const r = await fetch('/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token, new_password: newPw})
    });
    const d = await r.json();
    if (!r.ok) { showError(err, d.detail || 'Reset failed'); return; }
    window.location.href = '/login?reset=1';
  } catch(e) { showError(err, 'Connection error'); }
}

// Show forgot password link
const loginForm = document.getElementById('form-login');
if (loginForm) {
  const forgotLink = document.createElement('div');
  forgotLink.style.cssText = 'text-align:right;margin-top:8px';
  forgotLink.innerHTML = '<a href="#" onclick="showForgotPassword()" style="font-size:13px;color:var(--muted);text-decoration:none">Forgot password?</a>';
  loginForm.insertBefore(forgotLink, loginForm.querySelector('button'));
}

function showForgotPassword() {
  document.getElementById('form-login').style.display = 'none';
  const fp = document.createElement('div');
  fp.id = 'form-forgot';
  fp.innerHTML = `
    <p style="font-size:14px;color:var(--muted);margin-bottom:16px">Enter your email and we will send you a reset link.</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="forgot-email" placeholder="you@example.com" />
    </div>
    <button class="btn btn-primary" onclick="doForgot()">Send Reset Link</button>
    <div style="margin-top:12px"><a href="#" onclick="switchTab('login')" style="font-size:13px;color:var(--muted);text-decoration:none">Back to sign in</a></div>
    <div class="error" id="forgot-error"></div>
    <div id="forgot-success" style="color:var(--green);font-size:13px;margin-top:12px;display:none"></div>
  `;
  document.querySelector('.card').appendChild(fp);
}

async function doForgot() {
  const email = document.getElementById('forgot-email').value.trim();
  const err = document.getElementById('forgot-error');
  const success = document.getElementById('forgot-success');
  if (!email) { showError(err, 'Please enter your email'); return; }
  try {
    const r = await fetch('/auth/forgot-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email})
    });
    const d = await r.json();
    err.style.display = 'none';
    success.textContent = d.message;
    success.style.display = 'block';
  } catch(e) { showError(err, 'Connection error'); }
}

// Show verification banner if needed
const verified = new URLSearchParams(window.location.search).get('verified');
if (verified) {
  const banner = document.createElement('div');
  banner.style.cssText = 'background:rgba(34,211,165,.1);border:1px solid rgba(34,211,165,.3);border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--green);text-align:center';
  banner.textContent = 'Email verified successfully. You can now sign in.';
  document.querySelector('.card').insertBefore(banner, document.querySelector('.tabs'));
}
</script>
</body>
</html>
